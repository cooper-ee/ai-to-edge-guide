<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="620" viewBox="0 0 1220 620" role="img" aria-label="按依赖组织的 AI 到端侧学习路线"><title>按依赖组织的 AI 到端侧学习路线</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#07878b"/></marker></defs><g font-family='"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif'><rect width="1220" height="620" rx="22" fill="#f3f8fa"/><text x="40" y="52" font-size="29" fill="#142f43" font-weight="700">一条主线，三条可选深化路线</text><text x="40" y="83" font-size="17" fill="#526b7c" font-weight="400">先建立正确性，再研究效率；先跑通小模型，再进入设备。</text><path d="M375,198 L424,198" fill="none" stroke="#07878b" stroke-width="2" marker-end="url(#arrow)"/><path d="M765,198 L814,198" fill="none" stroke="#07878b" stroke-width="2" marker-end="url(#arrow)"/><path d="M207,270 L207,343" fill="none" stroke="#07878b" stroke-width="2" marker-end="url(#arrow)"/><path d="M597,270 L597,343" fill="none" stroke="#07878b" stroke-width="2" marker-end="url(#arrow)"/><path d="M987,270 L987,343" fill="none" stroke="#07878b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="125" width="335" height="145" rx="16" fill="white" stroke="#07878b" stroke-width="1.5"/><rect x="40" y="125" width="5" height="145" rx="2" fill="#07878b"/><text x="58" y="159" font-size="21" fill="#142f43" font-weight="700">00–03 · 基础与交付</text><text x="58" y="187" font-size="15" fill="#526b7c" font-weight="400">数据 → 梯度 → 模型</text><text x="58" y="212" font-size="15" fill="#526b7c" font-weight="400">PyTorch → ONNX 对照</text><rect x="430" y="125" width="335" height="145" rx="16" fill="white" stroke="#07878b" stroke-width="1.5"/><rect x="430" y="125" width="5" height="145" rx="2" fill="#07878b"/><text x="448" y="159" font-size="21" fill="#142f43" font-weight="700">04–06 · 推理机制</text><text x="448" y="187" font-size="15" fill="#526b7c" font-weight="400">Transformer / KV Cache</text><text x="448" y="212" font-size="15" fill="#526b7c" font-weight="400">量化误差与存储账本</text><rect x="820" y="125" width="335" height="145" rx="16" fill="white" stroke="#07878b" stroke-width="1.5"/><rect x="820" y="125" width="5" height="145" rx="2" fill="#07878b"/><text x="838" y="159" font-size="21" fill="#142f43" font-weight="700">14–16 · 系统闭环</text><text x="838" y="187" font-size="15" fill="#526b7c" font-weight="400">HTTP / 基准 / 项目</text><text x="838" y="212" font-size="15" fill="#526b7c" font-weight="400">原始数据与可复现报告</text><rect x="40" y="350" width="335" height="145" rx="16" fill="white" stroke="#07878b" stroke-width="1.5"/><rect x="40" y="350" width="5" height="145" rx="2" fill="#07878b"/><text x="58" y="384" font-size="21" fill="#142f43" font-weight="700">07–08 · 应用支线</text><text x="58" y="412" font-size="15" fill="#526b7c" font-weight="400">检索与工具校验</text><text x="58" y="437" font-size="15" fill="#526b7c" font-weight="400">本地模型与证据回答</text><rect x="430" y="350" width="335" height="145" rx="16" fill="white" stroke="#07878b" stroke-width="1.5"/><rect x="430" y="350" width="5" height="145" rx="2" fill="#07878b"/><text x="448" y="384" font-size="21" fill="#142f43" font-weight="700">09–11 · 系统深化</text><text x="448" y="412" font-size="15" fill="#526b7c" font-weight="400">Serving / 编译器</text><text x="448" y="437" font-size="15" fill="#526b7c" font-weight="400">GPU Kernel / 在线归一化</text><rect x="820" y="350" width="335" height="145" rx="16" fill="white" stroke="#07878b" stroke-width="1.5"/><rect x="820" y="350" width="5" height="145" rx="2" fill="#07878b"/><text x="838" y="384" font-size="21" fill="#142f43" font-weight="700">12–13、17 · 端侧深化</text><text x="838" y="412" font-size="15" fill="#526b7c" font-weight="400">RKNN / RKLLM</text><text x="838" y="437" font-size="15" fill="#526b7c" font-weight="400">混合架构与板端验证</text><text x="42" y="557" font-size="19" fill="#07878b" font-weight="600">CPU 实验已提供  ·  应用支线可跳过  ·  GPU/NPU 流程需对应硬件另测</text></g></svg>