<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="580" viewBox="0 0 1050 580" role="img" aria-label="Roofline 模型原创示意图"><title>Roofline 模型原创示意图</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#07878b"/></marker></defs><g font-family='"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif'><rect width="1050" height="580" rx="22" fill="#f3f8fa"/><text x="40" y="52" font-size="26" fill="#142f43" font-weight="700">Roofline：先问受计算限制，还是受搬运限制</text><path d="M110,465 L950,465" fill="none" stroke="#07878b" stroke-width="2" marker-end="url(#arrow)"/><path d="M110,465 L110,110" fill="none" stroke="#07878b" stroke-width="2" marker-end="url(#arrow)"/><path d="M130 440 L570 180 L930 180" fill="none" stroke="#07878b" stroke-width="7" stroke-linejoin="round"/><path d="M570 180 L570 465" stroke="#9aafbb" stroke-dasharray="6 6"/><text x="140" y="145" font-size="20" fill="#142f43" font-weight="400">有效性能（示意，非实测）</text><text x="640" y="160" font-size="20" fill="#07878b" font-weight="700">计算上限</text><text x="220" y="310" font-size="23" fill="#07878b" font-weight="650">带宽 × 算术强度</text><text x="410" y="510" font-size="22" fill="#142f43" font-weight="400">算术强度 FLOP / byte</text><text x="590" y="395" font-size="20" fill="#526b7c" font-weight="400">拐点 = 计算上限 / 带宽</text><text x="42" y="555" font-size="18" fill="#526b7c" font-weight="400">比较之前固定工作负载、精度、存储层级与测量口径。</text></g></svg>