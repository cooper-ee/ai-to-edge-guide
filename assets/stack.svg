<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-label="应用到硬件的五层知识体系"><title>应用到硬件的五层知识体系</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#07878b"/></marker></defs><g font-family='"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif'><rect width="1100" height="690" rx="22" fill="#f3f8fa"/><text x="40" y="50" font-size="28" fill="#142f43" font-weight="700">一次请求，穿过五层执行栈</text><rect x="40" y="88" width="700" height="82" rx="16" fill="white" stroke="#07878b" stroke-width="1.5"/><rect x="40" y="88" width="5" height="82" rx="2" fill="#07878b"/><text x="58" y="122" font-size="21" fill="#142f43" font-weight="700">应用与服务</text><text x="58" y="150" font-size="15" fill="#526b7c" font-weight="400">请求 / 检索 / 工具 / 排队 / 超时</text><path d="M780,148 L780,202" fill="none" stroke="#07878b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="190" width="700" height="82" rx="16" fill="white" stroke="#3668d4" stroke-width="1.5"/><rect x="40" y="190" width="5" height="82" rx="2" fill="#3668d4"/><text x="58" y="224" font-size="21" fill="#142f43" font-weight="700">模型与状态</text><text x="58" y="252" font-size="15" fill="#526b7c" font-weight="400">结构 / 权重 / tokenizer / KV 与递推状态</text><path d="M780,250 L780,304" fill="none" stroke="#07878b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="292" width="700" height="82" rx="16" fill="white" stroke="#07878b" stroke-width="1.5"/><rect x="40" y="292" width="5" height="82" rx="2" fill="#07878b"/><text x="58" y="326" font-size="21" fill="#142f43" font-weight="700">Runtime 与编译</text><text x="58" y="354" font-size="15" fill="#526b7c" font-weight="400">加载 / 图优化 / 调度 / 内存分配</text><path d="M780,352 L780,406" fill="none" stroke="#07878b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="394" width="700" height="82" rx="16" fill="white" stroke="#3668d4" stroke-width="1.5"/><rect x="40" y="394" width="5" height="82" rx="2" fill="#3668d4"/><text x="58" y="428" font-size="21" fill="#142f43" font-weight="700">算子与 Kernel</text><text x="58" y="456" font-size="15" fill="#526b7c" font-weight="400">GEMM / 归一化 / Attention / 布局</text><path d="M780,454 L780,508" fill="none" stroke="#07878b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="496" width="700" height="82" rx="16" fill="white" stroke="#07878b" stroke-width="1.5"/><rect x="40" y="496" width="5" height="82" rx="2" fill="#07878b"/><text x="58" y="530" font-size="21" fill="#142f43" font-weight="700">硬件与系统</text><text x="58" y="558" font-size="15" fill="#526b7c" font-weight="400">CPU / GPU / NPU / 带宽 / 驱动 / 线程</text><text x="810" y="155" font-size="21" fill="#07878b" font-weight="700">每层都问：</text><text x="810" y="207" font-size="19" fill="#142f43" font-weight="400">输入输出是什么？</text><text x="810" y="257" font-size="19" fill="#142f43" font-weight="400">状态由谁拥有？</text><text x="810" y="307" font-size="19" fill="#142f43" font-weight="400">错误在哪里发生？</text><text x="810" y="357" font-size="19" fill="#142f43" font-weight="400">证据如何核查？</text><text x="43" y="652" font-size="20" fill="#07878b" font-weight="600">正确性 → 数值对照 → 任务质量 → 性能 → 稳定性</text></g></svg>