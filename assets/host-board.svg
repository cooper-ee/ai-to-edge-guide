<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-label="Host 转换与 Board 执行的兼容链路"><title>Host 转换与 Board 执行的兼容链路</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#07878b"/></marker></defs><g font-family='"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif'><rect width="1200" height="570" rx="22" fill="#f3f8fa"/><text x="38" y="52" font-size="28" fill="#142f43" font-weight="700">Host 与 Board：转换和执行是两段工作</text><rect x="35" y="95" width="490" height="380" rx="20" fill="white" stroke="#07878b"/><text x="57" y="135" font-size="22" fill="#07878b" font-weight="700">HOST · 转换环境</text><rect x="675" y="95" width="490" height="380" rx="20" fill="white" stroke="#3668d4"/><text x="697" y="135" font-size="22" fill="#3668d4" font-weight="700">BOARD · 执行环境</text><rect x="60" y="160" width="440" height="86" rx="16" fill="white" stroke="#07878b" stroke-width="1.5"/><rect x="60" y="160" width="5" height="86" rx="2" fill="#07878b"/><text x="78" y="194" font-size="21" fill="#142f43" font-weight="700">模型与契约</text><text x="78" y="222" font-size="15" fill="#526b7c" font-weight="400">config / tokenizer / 预处理</text><rect x="60" y="260" width="440" height="86" rx="16" fill="white" stroke="#07878b" stroke-width="1.5"/><rect x="60" y="260" width="5" height="86" rx="2" fill="#07878b"/><text x="78" y="294" font-size="21" fill="#142f43" font-weight="700">转换与量化</text><text x="78" y="322" font-size="15" fill="#526b7c" font-weight="400">Toolkit / target / 校准数据</text><rect x="60" y="360" width="440" height="86" rx="16" fill="white" stroke="#07878b" stroke-width="1.5"/><rect x="60" y="360" width="5" height="86" rx="2" fill="#07878b"/><text x="78" y="394" font-size="21" fill="#142f43" font-weight="700">产物与证据</text><text x="78" y="422" font-size="15" fill="#526b7c" font-weight="400">artifact / SHA256 / 日志</text><rect x="700" y="160" width="440" height="86" rx="16" fill="white" stroke="#3668d4" stroke-width="1.5"/><rect x="700" y="160" width="5" height="86" rx="2" fill="#3668d4"/><text x="718" y="194" font-size="21" fill="#142f43" font-weight="700">Runtime 与驱动</text><text x="718" y="222" font-size="15" fill="#526b7c" font-weight="400">版本 / ABI / BSP / 芯片</text><rect x="700" y="260" width="440" height="86" rx="16" fill="white" stroke="#3668d4" stroke-width="1.5"/><rect x="700" y="260" width="5" height="86" rx="2" fill="#3668d4"/><text x="718" y="294" font-size="21" fill="#142f43" font-weight="700">执行与输出</text><text x="718" y="322" font-size="15" fill="#526b7c" font-weight="400">输入张量 / 推理 / 后处理</text><rect x="700" y="360" width="440" height="86" rx="16" fill="white" stroke="#3668d4" stroke-width="1.5"/><rect x="700" y="360" width="5" height="86" rx="2" fill="#3668d4"/><text x="718" y="394" font-size="21" fill="#142f43" font-weight="700">设备验收</text><text x="718" y="422" font-size="15" fill="#526b7c" font-weight="400">数值 / 任务 / 内存 / 延迟</text><path d="M530,315 L667,315" fill="none" stroke="#07878b" stroke-width="2" marker-end="url(#arrow)"/><text x="536" y="285" font-size="16" fill="#07878b" font-weight="400">校验后传输</text><text x="38" y="527" font-size="21" fill="#07878b" font-weight="600">转换成功 ≠ 加载成功 ≠ 数值正确 ≠ 满足任务与性能目标</text></g></svg>