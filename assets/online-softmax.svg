<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-label="在线 softmax 合并分块状态"><title>在线 softmax 合并分块状态</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#07878b"/></marker></defs><g font-family='"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif'><rect width="1000" height="550" rx="22" fill="#f3f8fa"/><text x="35" y="52" font-size="28" fill="#142f43" font-weight="700">在线 softmax：用三个状态合并分块</text><rect x="35" y="125" width="270" height="150" rx="16" fill="white" stroke="#07878b" stroke-width="1.5"/><rect x="35" y="125" width="5" height="150" rx="2" fill="#07878b"/><text x="53" y="159" font-size="21" fill="#142f43" font-weight="700">已读部分</text><text x="53" y="187" font-size="15" fill="#526b7c" font-weight="400">最大值 m</text><text x="53" y="212" font-size="15" fill="#526b7c" font-weight="400">分母 ℓ / 加权和 a</text><rect x="365" y="125" width="270" height="150" rx="16" fill="white" stroke="#07878b" stroke-width="1.5"/><rect x="365" y="125" width="5" height="150" rx="2" fill="#07878b"/><text x="383" y="159" font-size="21" fill="#142f43" font-weight="700">对齐指数基准</text><text x="383" y="187" font-size="15" fill="#526b7c" font-weight="400">m′ = max(m, m_block)</text><text x="383" y="212" font-size="15" fill="#526b7c" font-weight="400">旧状态乘 exp(m − m′)</text><rect x="695" y="125" width="270" height="150" rx="16" fill="white" stroke="#07878b" stroke-width="1.5"/><rect x="695" y="125" width="5" height="150" rx="2" fill="#07878b"/><text x="713" y="159" font-size="21" fill="#142f43" font-weight="700">合并新块</text><text x="713" y="187" font-size="15" fill="#526b7c" font-weight="400">加新块的指数与加权项</text><text x="713" y="212" font-size="15" fill="#526b7c" font-weight="400">输出 = a′ / ℓ′</text><path d="M309,200 L357,200" fill="none" stroke="#07878b" stroke-width="2" marker-end="url(#arrow)"/><path d="M639,200 L687,200" fill="none" stroke="#07878b" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="352" font-size="25" fill="#07878b" font-weight="700">不能把每个块各自归一化后直接拼接。</text><text x="40" y="401" font-size="22" fill="#142f43" font-weight="400">必须让旧结果与新块使用同一个最大值基准。</text><text x="40" y="475" font-size="17" fill="#526b7c" font-weight="400">数值参考：edge_ai_labs/math_labs.py · online_attention</text></g></svg>